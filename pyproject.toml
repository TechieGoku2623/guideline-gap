[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guideline-gap"
version = "1.0.0"
description = "Label a guideline recommendation against a chart span."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Choppa Devasai Pranatheswar" }]
dependencies = []

[project.scripts]
guideline-gap = "guideline_gap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
